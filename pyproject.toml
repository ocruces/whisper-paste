[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-paste"
version = "1.0.0"
description = "Windows voice-dictation tray app — global hotkey, local Whisper, instant paste."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Olivier Cruces Robineau" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "faster-whisper",
    "pywhispercpp",
    "sounddevice",
    "numpy",
    "keyboard",
    "pystray",
    "Pillow",
    "pywin32",
]

[project.optional-dependencies]
dev = ["pytest", "wheel"]

[project.urls]
Homepage = "https://github.com/ocruces/whisper-paste"
Repository = "https://github.com/ocruces/whisper-paste"
Issues = "https://github.com/ocruces/whisper-paste/issues"

[project.scripts]
whisper-paste = "whisper_paste.app:main"

[tool.setuptools]
packages = ["whisper_paste"]

[tool.setuptools.package-data]
whisper_paste = ["resources/models.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
