; WhisperPaste settings
; =====================
;
; This file lets you change WhisperPaste's settings without typing any
; command line. It ships with EVERYTHING TURNED OFF: every setting below is
; commented out, so out of the box this file changes nothing at all.
;
; HOW TO USE IT
;   1. Open this file in Notepad (right-click -> Open with -> Notepad).
;   2. Find the setting you want and delete the ';' at the very start of its
;      line - just the ';', leave the rest alone.
;   3. Change the value after the '=' sign.
;   4. Save the file (Ctrl+S).
;   5. Quit WhisperPaste (right-click the tray icon -> Quit) and start it
;      again. Settings are read once, when it starts.
;
; RULES, so nothing breaks
;   - Keep the [whisper-paste] line below exactly as it is. Everything must
;     stay underneath it.
;   - One setting per line, always 'name = value'.
;   - A line starting with ';' or '#' is a comment and is ignored.
;   - Do not put quotes around values. Write   language = es
;     and not   language = "es"
;   - In log_dir you may use the usual Windows shortcuts: %LOCALAPPDATA%,
;     %USERPROFILE% and ~ (your user folder) are expanded when WhisperPaste
;     starts. A plain full path such as C:\Users\YourName\Documents works too.
;   - If a setting is missing, commented out, or left empty, WhisperPaste uses
;     its default - which is what the comment above each one tells you.
;
; COMMAND-LINE FLAGS ALWAYS WIN
;   Anything passed on the command line (for example by one of the
;   WhisperPaste-<language>.cmd launchers next to the exe, or in
;   debug-console.cmd) overrides the same setting in this file.
;
; WHERE THIS FILE IS LOOKED FOR
;   WhisperPaste reads the FIRST of these that exists and then stops looking -
;   only ever one file is read, never two merged together:
;     1. The file you point at with the --config flag, e.g.
;        WhisperPaste.exe --config D:\my-settings.ini
;        If that file does not exist, WhisperPaste tells you so and starts with
;        its built-in defaults; it does NOT fall back to 2 or 3.
;     2. whisper-paste.ini next to WhisperPaste.exe - that is this copy, the
;        easy one to edit.
;     3. %LOCALAPPDATA%\WhisperPaste\whisper-paste.ini - a personal copy that
;        survives replacing this folder with a newer version of WhisperPaste.
;        Create the folder and copy this file there if you want that. Because
;        the copy next to the exe (2) ships with WhisperPaste and therefore
;        always exists, it wins: delete or rename it for the personal copy to
;        be used.

[whisper-paste]

; Dictation language, as a short code: en, es, fr, de, it, pt, nl, ...
; Leave it out (or empty) to let Whisper detect the language by itself.
; Setting it is faster and more reliable if you always dictate in one language.
; Default: empty, i.e. auto-detect.
;language = en

; Which Whisper model to use: tiny, base, small, medium, large-v3, or a
; language-specific one such as distil-small.en. Only the model bundled in
; this folder works offline; any other one is downloaded from the internet the
; first time it is used, and bigger models are slower and need more memory.
; Default: small (the bundled one).
;model = small

; The key combination that starts and stops recording. Press it once to start
; talking, press it again to stop and paste. Join keys with '+', e.g.
; ctrl+alt+d, or ctrl+shift+f9. Pick something no other program uses.
; The same setting can be passed on the command line with --hotkey, which wins
; over this file. If the combination cannot be understood, WhisperPaste logs the
; error and starts with the default instead of refusing to start.
; The Windows key cannot be part of the combination. It does not work -
; WhisperPaste will tell you and use the default instead.
; Default: ctrl+shift+space
;hotkey = ctrl+shift+space

; Clean up the transcript with a local AI model (grammar, punctuation, filler
; words) before pasting it. This needs Ollama installed and running on this
; same PC; without it, nothing is refined and the raw transcript is pasted.
; It also makes each dictation take noticeably longer.
; Use true or false.
; Default: false
;refine = false

; How the text reaches the window you are typing in.
;   clipboard - paste it in one go (fast; your previous clipboard is put back
;               afterwards). This is what almost everyone wants.
;   type      - type it out character by character. Slow, but it works in the
;               few programs that block pasting.
; Default: clipboard
;output = clipboard

; Also write what you dictated into the log file. Off by default on purpose:
; the log is kept on disk, so turning this on leaves a permanent readable
; record of everything you ever dictate. Handy for a day of troubleshooting,
; not something to leave on.
; Use true or false.
; Default: false
;log_transcripts = false

; Folder for the log file. The folder is created if it does not exist.
; Default: %LOCALAPPDATA%\WhisperPaste\logs
;log_dir = C:\Users\YourName\Documents\WhisperPaste-logs
